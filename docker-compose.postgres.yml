services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: tenantrag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tenantrag}
      POSTGRES_USER: ${POSTGRES_USER:-tenantrag_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - tenantrag_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tenantrag_app} -d ${POSTGRES_DB:-tenantrag}"]
      interval: 5s
      timeout: 3s
      retries: 20

  ollama:
    image: ollama/ollama:latest
    container_name: tenantrag-ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - tenantrag_ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  tenantrag_postgres_data:
  tenantrag_ollama_data:
