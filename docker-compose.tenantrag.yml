# Full TenantRAG stack: Postgres+pgvector (system of record), Qdrant (comparison backend),
# Redis (cache + rate-limit state), and the API.  docker compose -f docker-compose.tenantrag.yml up --build
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: tenantrag
      POSTGRES_USER: tenantrag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports: ["5432:5432"]
    volumes: [pg_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenantrag -d tenantrag"]
      interval: 5s
      retries: 20
  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes: [qdrant_data:/qdrant/storage]
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["6379:6379"]
  migrate:
    build: {context: ., dockerfile: Dockerfile.tenantrag}
    command: ["alembic", "-c", "alembic-postgres.ini", "upgrade", "head"]
    environment:
      POSTGRES_DATABASE_URL: postgresql://tenantrag:${POSTGRES_PASSWORD}@postgres:5432/tenantrag
    depends_on: {postgres: {condition: service_healthy}}
  api:
    build: {context: ., dockerfile: Dockerfile.tenantrag}
    ports: ["8100:8100"]
    environment:
      POSTGRES_DATABASE_URL: postgresql://tenantrag:${POSTGRES_PASSWORD}@postgres:5432/tenantrag
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
    depends_on: {migrate: {condition: service_completed_successfully}, redis: {condition: service_started}}
volumes:
  pg_data:
  qdrant_data:
