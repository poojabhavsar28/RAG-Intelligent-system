name: PostgreSQL migration checks

on:
  pull_request:
    branches: [main, development]
  push:
    branches: [feature/tenantrag-enterprise-upgrade]

jobs:
  postgres-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: tenantrag
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: tenantrag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tenantrag -d tenantrag"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      POSTGRES_DATABASE_URL: postgresql://tenantrag:ci-password@localhost:5432/tenantrag
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install migration dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "SQLAlchemy>=2.0,<3.0" "alembic>=1.13,<2.0" "psycopg[binary]>=3.2,<4.0" "pgvector>=0.3,<1.0" "pytest>=8,<10"
      - name: Apply PostgreSQL migrations
        run: alembic -c alembic-postgres.ini upgrade head
      - name: Verify migration state
        run: alembic -c alembic-postgres.ini current
      - name: Compile PostgreSQL modules
        run: python -m compileall -q app/infrastructure/postgres alembic_postgres
      - name: Run tenant identifier unit tests
        run: python -m pytest -q tests/test_tenant_db.py
